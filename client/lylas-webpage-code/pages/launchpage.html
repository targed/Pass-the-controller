<!-- Launch page HTML (alpha) -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
       name="viewport"
       content="width=device-width, initial-scale=1.0" />
    <title>Pass The Controller</title>
    <link rel="stylesheet" href="./launchstyle.css" />
  </head>
  <body>
    <!-- TODO: Add profile icon -->
    <button id="profile-button" type="button"></button>
    <main>
      <!-- TODO: Add logo image OR create svg -->
      <img id="logo" src="" alt="Pass The Controller Logo"/>
      <h1 id="title">Pass The Controller</h1>
      <!-- TODO: Make buttons redirect to associated pages/open pop-up windows -->
      <!-- note: pop-up windows should not allow user to interact with website behind pop-up until pop-up disappears. -->
      <div id="main-buttons">
        <div id="enter-room-code" class="main-option">
          <a href="#room-code">
            <button type="button">
              <p>Enter Room Code</p>
            </button>
          </a>
        </div>
        <div id="discover-rooms" class="main-option">
          <button type="button">
            <p>Discover Rooms</p>
          </button>
        </div>
        <div id="create-room" class="main-option">
          <button type="button">
            <p>Create Room</p>
          </button>
        </div>
      </div>
    </main>
    <!-- popups -->
    <!-- room code -->
    <div id="room-code" class="popup">
      <div class="popup-content">
        <h3>Create Room +</h3>
        <input type="checkbox" id="public" name="public"/>
        <label for="public">Publicly Discoverable</label>
        <p>
          <a href="#">Close</a>
        </p>
      </div>
    </div>
  </body>
</html>
